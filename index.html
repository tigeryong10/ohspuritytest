<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHS Purity Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>OHS Purity Test</h1>
      <p class="subtitle">Check every item you have done. Your score starts at the total and drops by one for each box you check.</p>
    </header>

    <div id="score" class="score">Score: &ndash;</div>

    <p class="note">Full question set coming soon &mdash; the items below are placeholders to prove the mechanism.</p>

    <ol class="questions">
      <li><label><input type="checkbox"> Pulled an all-nighter for a class</label></li>
      <li><label><input type="checkbox"> Emailed a teacher at 2 AM</label></li>
      <li><label><input type="checkbox"> Joined a club just for the college apps</label></li>
      <li><label><input type="checkbox"> Fell asleep in a live session</label></li>
      <li><label><input type="checkbox"> Submitted an assignment in the final minute before the deadline</label></li>
    </ol>

    <footer>
      <button id="reset" type="button">Reset</button>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
